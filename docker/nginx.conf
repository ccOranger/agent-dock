# 后端容器重建后 IP 会变：用 Docker 内置 DNS 动态解析，避免 Nginx 缓存旧地址导致 502
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_up {
    zone backend_up 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 知识库文档上传：与后端 UPLOAD_MAX_SIZE_MB（默认 20）留出余量
    client_max_body_size 25m;

    # 后端 API（含 SSE 流式对话）
    location /api/ {
        proxy_pass http://backend_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：必须关闭缓冲，否则流式分块会被 Nginx 攒包后一次性下发
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 健康探针（容器/负载均衡用）
    location = /health {
        proxy_pass http://backend_up/health;
        proxy_set_header Host $host;
    }

    # 指标不对外暴露：需要时经鉴权的 /api/v1/admin/metrics 获取

    # 管理后台：产物在 html/admin，SPA 回退到 /admin/index.html
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 客户聊天端：SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
