# 宿主机 Nginx 站点配置示例：不用 web 容器，直接托管两端静态 + 反代 backend 容器。
# 与 docker/nginx.conf（容器内那份）行为对齐，落地方式：
#   sudo cp docker/nginx.host.example.conf /etc/nginx/conf.d/agentdock.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 静态产物来源（仓库根执行，admin 必须带 VITE_BASE=/admin/ 构建）：
#   npm ci
#   npm run build -w frontend          → frontend/dist/*      拷到 /srv/smart-cs/web/
#   VITE_BASE=/admin/ npm run build -w admin-frontend
#                                       → admin-frontend/dist/* 拷到 /srv/smart-cs/web/admin/

server {
    listen 80;
    server_name cs.example.com;                 # 换成你的域名；上 HTTPS 时参照 docs/deployment.md §4

    root /srv/smart-cs/web;
    index index.html;
    charset utf-8;

    # 知识库文档上传：与后端 UPLOAD_MAX_SIZE_MB（默认 20）留余量
    client_max_body_size 25m;

    # 后端 API（含 SSE 流式对话）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：必须关闭缓冲，否则流式分块会被 Nginx 攒包后一次性下发
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 健康探针：/health 直达后端（没有 /api/health 这个路径）
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # 指标不对外暴露：需要时经鉴权的 /api/v1/admin/metrics 获取

    # 管理后台：产物在 web/admin，SPA 回退到 /admin/index.html
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 客户对话端 SPA（/embed.html 是真实文件，由 $uri 直接命中，不走回退）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
