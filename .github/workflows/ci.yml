name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (${{ matrix.app }} build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces：锁文件在仓库根，一次 npm ci 装好两个前端与 packages/shared
      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.app }}
        run: npm run build -w ${{ matrix.app }}

  docker:
    name: Docker (${{ matrix.image }} image)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: docker/backend.Dockerfile
          - image: web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只构建不推送：镜像只要构建失败（依赖解析、COPY 路径、前端产物）就应该在 PR 上暴露
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: smart-cs/${{ matrix.image }}:ci
          # 分层缓存走 GitHub Actions 缓存，两个镜像各用一个 scope，避免互相覆盖
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Inspect image
        run: docker image inspect smart-cs/${{ matrix.image }}:ci --format '{{.Id}} {{.Size}}'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # 观察模式，不阻塞合并：前端 devDependencies 的 vite / esbuild 链与 hello-agents 的许可问题
    # 都不是一天能清掉的（见 SECURITY.md「依赖漏洞与许可证」）。基线稳定后删掉 continue-on-error。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r backend/requirements-dev.txt

      - name: pip-audit (requirements.txt)
        run: pip-audit -r backend/requirements.txt

      # 白名单校验失败只告警：清单本身要先进仓库，处置结论记在 docs/open-source-release.md 的 B4
      - name: License whitelist
        run: python scripts/license_report.py --check || echo "::warning::存在未确认的许可证，见 docs/third-party-licenses.md"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # 只看随镜像分发的依赖；devDependencies 不进产物，单独在 SECURITY.md 记录
      - name: npm audit (prod only)
        run: npm audit --omit=dev --audit-level=high
