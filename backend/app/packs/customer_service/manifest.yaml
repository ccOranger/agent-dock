# 客服/售后场景包清单。
# 内核只读取这些通用字段装载资产，不解释业务含义；新增场景包时复制此结构即可。
name: customer_service
display_name: 客服/售后场景包
version: 0.1.0
enabled: true

# 运营台能力开关：声明包需要的通用功能，由前端决定导航与页面是否可见。
# tickets=工单管理（复用内核 tickets 表与 /admin/tickets 接口）。
features:
  - tickets

# 包内代码 Agent：模块路径:类名（类需继承 BaseBusinessAgent，name 全局唯一）
agents:
  - app.packs.customer_service.agents.knowledge_agent:KnowledgeAgent
  - app.packs.customer_service.agents.order_agent:OrderAgent
  - app.packs.customer_service.agents.complaint_agent:ComplaintAgent

# 包内自定义工具：模块路径:类名（类需继承 BaseTool，name 全局唯一，与 MCP 工具名共用唯一约束）
tools:
  - app.packs.customer_service.tools.order_tool:ListOrdersTool
  - app.packs.customer_service.tools.order_tool:QueryOrderTool
  - app.packs.customer_service.tools.order_tool:ModifyOrderTool
  - app.packs.customer_service.tools.logistics_tool:QueryLogisticsTool
  - app.packs.customer_service.tools.refund_tool:SubmitRefundTool
  - app.packs.customer_service.tools.refund_tool:QueryRefundTool
  - app.packs.customer_service.tools.ticket_tool:CreateTicketTool
  - app.packs.customer_service.tools.ticket_tool:UpdateTicketTool
  - app.packs.customer_service.tools.ticket_tool:EscalateTool

# 领域知识库命名空间：声明归属，供检索范围收敛与后台分组使用（P1 起生效）
knowledge:
  namespaces:
    - cs_default
    - cs_order
    - cs_after_sales
