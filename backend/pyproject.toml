[project]
name = "cs-backend"
version = "0.1.0"
description = "AgentDock backend (HelloAgents + FastAPI; repo codename smart-cs)"
requires-python = ">=3.11,<3.13"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 让 pytest 入口（而非 python -m pytest）也能从 backend 根导入 app 包
pythonpath = ["."]
