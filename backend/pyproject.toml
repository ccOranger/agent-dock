[project]
name = "cs-backend"
version = "0.2.0"
description = "AgentDock backend (HelloAgents + FastAPI; repo codename smart-cs)"
requires-python = ">=3.11,<3.13"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [{ name = "The smart-cs Authors" }]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/ccOranger/smart-cs"
Issues = "https://github.com/ccOranger/smart-cs/issues"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 让 pytest 入口（而非 python -m pytest）也能从 backend 根导入 app 包
pythonpath = ["."]
